---
- name: Full Deploy VPN Node
  hosts: all
  become: yes
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3
    # Эти переменные прилетают из Мастера (internal/runner) файлом extra-vars
    master_url: ""
    priv_key: ""
    node_token: ""
    node_role: ""
    agent_src: ""
    self_steal_domain: ""
    self_steal_cdn_domain: ""
    self_steal_site_b64: ""
    node_ssh_port: "22"
    warp_transit: "false"

  pre_tasks:
    # raw идёт по SSH напрямую. Модули apt, command и systemd требуют Python.
    - name: Подготовка Python для Ansible
      raw: |
        set -e
        if /usr/bin/python3 -c 'import apt' >/dev/null 2>&1; then
          exit 0
        fi
        export DEBIAN_FRONTEND=noninteractive
        apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -q
        apt-get install -y -q --no-install-recommends python3 python3-apt
        echo KVN_PYTHON_INSTALLED
      register: python_bootstrap
      changed_when: "'KVN_PYTHON_INSTALLED' in python_bootstrap.stdout"
      tags: [always]

  tasks:
    - name: Проверка переменных
      assert:
        that:
          - master_url | length > 0
          - priv_key | length > 0
          - node_token | length > 0
          - agent_src | length > 0
        fail_msg: "Мастер не передал обязательные параметры (MASTER_URL не задан?)"

    - name: Установка зависимостей
      apt:
        name: [curl, ufw]
        state: present
        update_cache: yes

    # В контейнерах (OpenVZ, LXC) часть параметров менять нельзя — это не повод падать
    - name: Сетевой тюнинг (BBR, fq, буферы TCP)
      block:
        - name: Модуль BBR при загрузке
          copy:
            dest: /etc/modules-load.d/kvn-bbr.conf
            content: "tcp_bbr\n"
            mode: "0644"
        - name: Загрузка модуля BBR
          command: modprobe tcp_bbr
          changed_when: false
          failed_when: false
        - name: Параметры sysctl
          copy:
            src: files/99-kvn-network.conf
            dest: /etc/sysctl.d/99-kvn-network.conf
            mode: "0644"
        - name: Применение sysctl
          command: sysctl --system
          changed_when: false
          failed_when: false

    - name: Подготовка собственного сайта REALITY
      import_tasks: self_steal.yml
      when: self_steal_domain | length > 0
      tags: [self-steal]

    - name: Установка Xray (вместе с geoip.dat / geosite.dat)
      shell: bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
      args:
        creates: /usr/local/bin/xray

    - name: Создание папок для Агента
      file:
        path: /etc/vpn-agent
        state: directory
        mode: '0700'

    - name: Копирование бинарника Агента
      copy:
        src: "{{ agent_src }}"
        dest: /usr/local/bin/vpn-agent
        mode: '0755'

    - name: Создание конфигурации .env
      copy:
        dest: /etc/vpn-agent/.env
        content: |
          MASTER_URL={{ master_url }}
          NODE_TOKEN={{ node_token }}
          PRIVATE_KEY={{ priv_key }}
        mode: '0600'
      no_log: true

    - name: Настройка systemd службы для Агента
      copy:
        dest: /etc/systemd/system/vpn-agent.service
        content: |
          [Unit]
          Description=VPN Cluster Agent
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/etc/vpn-agent
          ExecStart=/usr/local/bin/vpn-agent
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    # Ошибка WARP не должна срывать установку VPN.
    - name: Установка Cloudflare WARP при деплое
      when: node_role == 'exit' or (warp_transit | bool)
      block:
        - import_tasks: warp.yml
      rescue:
        - name: WARP не установился
          debug:
            msg: "WARP не установлен — агент покажет статус после запуска"

    # never исключает эти задачи из обычного деплоя. Вызов из панели
    # запускает только эту группу и возвращает ошибки установки.
    - name: Установка WARP на действующем мосту
      tags: [never, install-warp]
      block:
        - import_tasks: warp.yml

        - name: Проверка доступа к HTTPS через SOCKS WARP
          command:
            argv:
              - curl
              - --fail
              - --silent
              - --show-error
              - --noproxy
              - ""
              - --socks5-hostname
              - 127.0.0.1:40000
              - --max-time
              - "10"
              - https://www.cloudflare.com/cdn-cgi/trace
          register: warp_trace
          until: warp_trace.rc == 0 and ('warp=on' in warp_trace.stdout_lines or 'warp=plus' in warp_trace.stdout_lines)
          retries: 8
          delay: 3
          changed_when: false

    - name: Настройка фаервола (API Xray слушает только localhost, его не открываем)
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ['{{ node_ssh_port }}', '443', '8443']  # 8443 — вход для CDN (включается в панели)

    - name: UDP 443 для Hysteria2 (открыт заранее — включается галочкой в панели)
      ufw:
        rule: allow
        port: "443"
        proto: udp

    - name: Запуск служб
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
        daemon_reload: yes
      loop:
        - xray
        - vpn-agent
