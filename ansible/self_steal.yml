---
- name: Проверка DNS собственного сайта
  command: "getent ahosts {{ self_steal_domain }}"
  register: self_steal_dns
  changed_when: false

- name: Проверка адреса ноды в DNS
  assert:
    that:
      - node_ip in self_steal_dns.stdout.split()
    fail_msg: "Домен {{ self_steal_domain }} должен указывать на {{ node_ip }} без CDN"

- name: Установка Caddy для собственного сайта
  apt:
    name: [caddy, curl, ufw]
    state: present
    update_cache: yes
    policy_rc_d: 101

- name: Открытие порта для ACME HTTP-01
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Создание каталога сайта
  file:
    path: /var/www/kvn-site
    state: directory
    mode: "0755"

- name: Установка конфигурации сайта
  copy:
    dest: /etc/caddy/KVN-SelfSteal
    mode: "0644"
    validate: /usr/bin/caddy adapt --adapter caddyfile --config %s
    content: |
      {
          admin off
          skip_install_trust
          auto_https disable_redirects
          servers 127.0.0.1:9444 {
              protocols h1 h2
          }
      }

      (public_site) {
          header Alt-Svc "clear"
          @custom file {
              root /var/www/kvn-site/custom
              try_files /index.html
          }
          handle @custom {
              root * /var/www/kvn-site/custom
              file_server
          }
          @archive file {
              root /var/www/kvn-site-archive/current
              try_files /index.html
          }
          handle @archive {
              header {
                  Content-Security-Policy "sandbox; default-src 'none'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; base-uri 'none'; form-action 'none'"
                  X-Content-Type-Options nosniff
                  Cache-Control no-store
                  Access-Control-Allow-Origin "*"
              }
              root * /var/www/kvn-site-archive/current
              file_server
          }
          handle {
              header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline' https:; img-src data: https:; font-src data: https:; base-uri 'none'; form-action 'none'"
              root * /var/www/kvn-site
              file_server {
                  hide /var/www/kvn-site/custom
              }
          }
          handle_errors {
              @missing file /{err.status_code}.html
              handle @missing {
                  header Content-Security-Policy "sandbox; default-src 'none'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; base-uri 'none'; form-action 'none'"
                  header Cache-Control no-store
                  rewrite * /{err.status_code}.html
                  file_server
              }
              respond "{err.status_text}" {err.status_code}
          }
      }

      http://{{ self_steal_domain }} {
          redir https://{{ self_steal_domain }}{uri} 308
      }

      https://{{ self_steal_domain }}:9444 {
          bind 127.0.0.1
          tls {
              issuer acme {
                  dir https://acme-v02.api.letsencrypt.org/directory
                  disable_tlsalpn_challenge
              }
          }
          import public_site
      }
      {% if self_steal_cdn_domain != "" and self_steal_cdn_domain != self_steal_domain %}

      http://{{ self_steal_cdn_domain }} {
          redir https://{{ self_steal_cdn_domain }}{uri} 308
      }

      https://{{ self_steal_cdn_domain }}:9444 {
          bind 127.0.0.1
          tls internal
          import public_site
      }
      {% endif %}
  register: self_steal_config

- name: Установка отдельной службы сайта
  copy:
    dest: /etc/systemd/system/kvn-self-steal.service
    mode: "0644"
    content: |
      [Unit]
      Description=KVN REALITY site
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=caddy
      Group=caddy
      StateDirectory=kvn-self-steal
      Environment=XDG_DATA_HOME=/var/lib/kvn-self-steal
      Environment=XDG_CONFIG_HOME=/var/lib/kvn-self-steal
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      ExecStart=/usr/bin/caddy run --config /etc/caddy/KVN-SelfSteal --adapter caddyfile
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  register: self_steal_unit

- name: Запуск собственного сайта
  systemd:
    name: kvn-self-steal
    enabled: yes
    daemon_reload: "{{ self_steal_unit.changed }}"
    state: "{{ 'restarted' if self_steal_config.changed or self_steal_unit.changed else 'started' }}"

- name: Ожидание доверенного сертификата и HTTP/2 на локальном сайте
  command:
    argv:
      - curl
      - --silent
      - --show-error
      - --noproxy
      - "*"
      - --max-time
      - "5"
      - --tlsv1.3
      - --http2
      - --connect-to
      - "{{ self_steal_domain }}:443:127.0.0.1:9444"
      - --output
      - /dev/null
      - --write-out
      - "%{http_version}"
      - "https://{{ self_steal_domain }}/"
  register: self_steal_https
  until: self_steal_https.rc == 0 and self_steal_https.stdout == '2'
  retries: 30
  delay: 3
  changed_when: false

- name: Проверка локального HTTPS для CDN-имени
  command:
    argv:
      - curl
      - --silent
      - --show-error
      - --noproxy
      - "*"
      - --max-time
      - "5"
      - --cacert
      - /var/lib/kvn-self-steal/caddy/pki/authorities/local/root.crt
      - --connect-to
      - "{{ self_steal_cdn_domain }}:443:127.0.0.1:9444"
      - --output
      - /dev/null
      - "https://{{ self_steal_cdn_domain }}/"
  register: self_steal_cdn_https
  until: self_steal_cdn_https.rc == 0
  retries: 10
  delay: 2
  changed_when: false
  when: self_steal_cdn_domain != "" and self_steal_cdn_domain != self_steal_domain

- name: Публикация страницы
  copy:
    src: "{{ (playbook_dir ~ '/../internal/website/index.html') if not self_steal_site_b64 else omit }}"
    content: "{{ (self_steal_site_b64 | b64decode) if self_steal_site_b64 else omit }}"
    dest: /var/www/kvn-site/index.html
    mode: "0644"
  when: self_steal_archive_b64 | length == 0

- name: Публикация архива
  when: self_steal_archive_b64 | length > 0
  block:
    - name: Временный файл для архива
      tempfile:
        state: file
      register: site_archive_file

    - name: Загрузка архива на ноду
      copy:
        content: "{{ self_steal_archive_b64 }}"
        dest: "{{ site_archive_file.path }}"
        mode: "0600"
      no_log: true

    - name: Применение файлов сайта
      script:
        cmd: "files/publish-site.py {{ site_archive_file.path | quote }}"
        executable: /usr/bin/python3
  always:
    - name: Удаление временного архива
      file:
        path: "{{ site_archive_file.path }}"
        state: absent
      when: site_archive_file.path is defined

- name: Отключение архива при возврате к одиночной странице
  file:
    path: /var/www/kvn-site-archive/current
    state: absent
  when: self_steal_archive_b64 | length == 0
