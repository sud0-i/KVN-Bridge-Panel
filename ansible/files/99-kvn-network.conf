# KVN-Bridge-Panel: сетевой тюнинг для VPN-нод.
# BBR и очередь fq заметно ускоряют TCP на длинных маршрутах с потерями
# (мост ↔ выходная нода ↔ пользователь). Буферы — под каналы до ~1 Гбит/с.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fastopen = 3
# Обход «чёрных дыр» MTU на пути (частая причина зависающих соединений через туннели)
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
